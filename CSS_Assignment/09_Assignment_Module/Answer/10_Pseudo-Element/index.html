<!DOCTYPE html>
<html>
<head>
<title>Pseudo Element Example</title>

<style>
p::first-letter{
    font-size: 30px;
    color: red;
    font-weight: bold;
}


span::before{
     content: "👉 Hello ,"; 
   border: 1px solid black;
   color: blue;
   
}

</style>
</head>

<body>

<h2>Pseudo Element Example</h2>

<p>This is a sample paragraph for pseudo-element example.</p>

<span>Learning CSS is fun and easy.</span>

</body>
</html>
