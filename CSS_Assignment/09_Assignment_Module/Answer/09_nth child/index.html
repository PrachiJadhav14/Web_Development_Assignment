<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nth child</title>
    <style>
        body{
            border: 1px solid rgb(73, 78, 9);
            background-color: azure;
            width: 500px;
            align-items: center;
            text-align: center;
        }
       
         ul li:nth-child(even){
            color: brown;
            font-size:32px;
            background-color: rgb(230, 227, 227);
         }
          ul li:nth-child(odd){
            color:rgb(225, 218, 218);
            font-size:32px;
            background-color: blueviolet;
          }
          li{
            box-shadow: 0 10px 7px 10px #d51e1e;
          }
    </style>
</head>
<body>
    <ul>
        <li>item List 1</li>
        <li>item List 2</li>
        <li>item List 3</li>
        <li>item List 4</li>
        <li>item List 5</li>
        <li>item List 6</li>
    </ul>
</body>
</html>
